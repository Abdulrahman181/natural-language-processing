[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwe-qlora"
version = "0.3.0"
description = "Reproducible CVE-to-CWE QLoRA evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "datasets>=3.0,<5",
  "huggingface_hub>=0.24,<1",
  "torch>=2.1,<3",
  "transformers>=4.46,<6",
  "peft>=0.13,<1",
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.43,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4,<9",
  "pytest-cov>=4,<7",
]
quality = [
  "ruff>=0.8,<1",
  "bandit>=1.7,<2",
]
serve = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
cwe-qlora = "cwe_qlora.cli:main"

[tool.setuptools.packages.find]
include = ["cwe_qlora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["cwe_qlora"]
omit = ["cwe_qlora/train.py", "cwe_qlora/predict.py", "cwe_qlora/api.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
