name: Static quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    name: static-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          failures=[]
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part in {'.git','.venv','venv','node_modules'} for part in p.parts): continue
              try: py_compile.compile(str(p), doraise=True)
              except Exception as e: failures.append(f'{p}: {e}')
          if failures: print('\n'.join(failures)); sys.exit(1)
          print('Python syntax OK')
          PY
      - name: Validate notebooks and JSON files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          failures=[]
          for p in list(pathlib.Path('.').rglob('*.ipynb')) + list(pathlib.Path('.').rglob('*.json')):
              if any(part in {'.git','.venv','venv','node_modules'} for part in p.parts): continue
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: failures.append(f'{p}: {e}')
          if failures: print('\n'.join(failures)); sys.exit(1)
          print('Notebook/JSON validation OK')
          PY
      - name: Run self-contained portfolio tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          if [ -d projects/agentic-data-analyst ]; then
            PYTHONPATH=projects/agentic-data-analyst pytest -q projects/agentic-data-analyst/tests
          elif [ -d projects/python-ml-pipeline-cli ]; then
            PYTHONPATH=projects/python-ml-pipeline-cli pytest -q projects/python-ml-pipeline-cli/tests
          else
            echo 'No self-contained portfolio test suite selected; dependency-heavy project tests require their project-specific environment.'
          fi
      - name: Install cwe-qlora CPU test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            'numpy<3' 'scikit-learn<2' 'pytest>=7.4,<9' 'pytest-cov>=4,<7' \
            'ruff>=0.8,<1' 'bandit>=1.7,<2'
      - name: Check cwe-qlora formatting and security
        working-directory: projects/cwe-qlora
        run: |
          ruff check .
          bandit -q -r cwe_qlora -c pyproject.toml
      - name: Run cwe-qlora test suite with coverage
        working-directory: projects/cwe-qlora
        run: |
          pytest -q --cov=cwe_qlora --cov-report=term-missing --cov-fail-under=70
